x-app: &app
  build:
    context: .
    dockerfile: infrastructure/docker/Dockerfile
  env_file: .env
  environment: &environment
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&connect_timeout=3
    REDIS_URL: redis://redis:6379
    S3_ENDPOINT: http://minio:9000
    API_INTERNAL_URL: http://api:4000
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
  storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    env_file: .env
    depends_on: [minio]
    entrypoint: /bin/sh
    command:
      [
        "-c",
        "until mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY; do sleep 2; done; mc mb --ignore-existing local/$$S3_BUCKET",
      ]
  migrate:
    <<: *app
    command: ["pnpm", "db:migrate"]
    depends_on:
      postgres: { condition: service_healthy }
  api:
    <<: *app
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
  web:
    <<: *app
    command: ["pnpm", "--filter", "@sahaflow/web", "start"]
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
  worker:
    <<: *app
    command: ["pnpm", "--filter", "@sahaflow/worker", "start"]
    depends_on:
      redis: { condition: service_healthy }
volumes:
  postgres-data:
  redis-data:
  minio-data:
